[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "md-test-case-to-excel"
version = "0.3.0"
description = "Markdownで書かれたテスト仕様書をExcel形式に変換するツール"
authors = [
    {name = "Anonymous", email = ""}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
md2excel = "md_test_case_to_excel.converter:main"

[project.urls]
Homepage = "https://github.com/your-username/md_test_case_to_excel"
Repository = "https://github.com/your-username/md_test_case_to_excel"

[tool.setuptools.packages.find]
where = ["."]
include = ["md_test_case_to_excel*"]

[tool.setuptools.package-data]
md_test_case_to_excel = ["*.yaml", "assets/*.xlsx"]

[tool.setuptools.data-files]
"md_test_case_to_excel" = ["md_test_case_to_excel/config.yaml"]
